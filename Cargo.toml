[workspace]
resolver = "2"
members = ["crates/core", "crates/chart", "crates/game"]

[workspace.package]
version = "0.1.0"
edition = "2021"

# Dependency versions are centralized here.
# Each crate uses `serde = { workspace = true }` and so on.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
macroquad = "0.4"

# Internal crates
rhythm-core = { path = "crates/core" }
rhythm-chart = { path = "crates/chart" }