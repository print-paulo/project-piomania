name: CI

# Runs on every push to main and on every Pull Request.
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      # Macroquad needs system audio libraries to build on Linux.
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Caches compiled dependencies between runs (makes CI much faster).
      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Formatting (cargo fmt)
        run: cargo fmt --all --check

      - name: Lint (cargo clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests (cargo test)
        run: cargo test --workspace
